name: ATP Tennis ETL y MLOps Pipeline

on:
  push:
    branches: [main, develop]
    paths:
      - "scraping/**/*.csv"
      - "models/**/*.py"
      - "src/atp_predictor/**/*.py"
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Diario a las 6 AM UTC
    - cron: "0 6 * * *"

jobs:
  lint-and-test:
    name: Lint y Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Linting con Ruff
        run: ruff check src/ tests/
        continue-on-error: true

      - name: Tests unitarios
        run: pytest tests/ -v --cov=src/atp_predictor --cov-report=xml
        continue-on-error: true

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  etl-pipeline:
    name: ETL Pipeline
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Validar datos de entrada
        run: |
          python -c "
          import os
          from pathlib import Path

          # Único archivo que de verdad hace falta: el histórico externo.
          # Los CSVs de scraping en vivo (ranking_2026.csv, etc.) son
          # opcionales — sin Selenium en CI, el pipeline sigue solo con
          # el histórico (ver scraping/fusionar_historico_final.py).
          required = [
              'data/external/historial_tenis_COMPLETO.csv',
          ]

          missing = [f for f in required if not Path(f).exists()]

          if missing:
              print(f'❌ Archivos faltantes: {missing}')
              exit(1)
          else:
              print('✅ Datos de entrada validados')
          "

      - name: Ejecutar Pipeline ETL
        run: |
          python scripts/run_etl_pipeline.py

      - name: Validar modelos generados
        run: |
          python -c "
          import joblib
          from pathlib import Path

          models_dir = Path('models')
          required_models = [
              'modelo_xgboost_final.pkl',
              'scaler_final.pkl',
              'h2h_tracker.pkl',
              'elo_tracker.pkl',
          ]

          all_exist = all((models_dir / m).exists() for m in required_models)

          if all_exist:
              print('✅ Todos los modelos fueron generados correctamente')
              
              # Verificar que el modelo se puede cargar
              model = joblib.load(models_dir / 'modelo_xgboost_final.pkl')
              print(f'📦 Modelo cargado: {type(model).__name__}')
          else:
              print('⚠️ Algunos modelos no fueron generados')
          "
        # Nota: este job ya no commitea los modelos/DB generados de vuelta al
        # repo. Esos artefactos se sacaron deliberadamente del tracking de
        # git (son regenerables, ver .gitignore) — auto-commitearlos de nuevo
        # aquí reintroduciría el mismo bloat que se resolvió a propósito.
